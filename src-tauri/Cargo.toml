[package]
name = "iso-piping-3d"
version = "0.1.0"
description = "Isometric piping sketch, 3D model and MTO"
edition = "2021"
rust-version = "1.77.2"
license = "UNLICENSED"
publish = false

[lib]
name = "iso_piping_3d_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
